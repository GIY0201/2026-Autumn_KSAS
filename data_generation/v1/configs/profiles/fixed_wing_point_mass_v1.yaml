source_evidence:
  - location: data_generation/v1/scenario.py:_working_region_failure
    statement: "Existing X8 diagnostic code checks an airspeed range of 14 through 22 m/s."
    use: legacy_simulation_design_not_airframe_limit
  - location: data_generation/v1/control.py:MAX_BANK_COMMAND_RAD
    statement: "Existing X8 controller uses a 15 degree maximum bank command."
    use: derived_point_mass_horizontal_acceleration_budget_only
limitations:
  - This constrained point-mass runner does not call the X8 6-DOF dynamics, controller, trim, or actuator code.
  - The source dataset is retained as provenance; this profile does not fit or replay its flight logs.
  - Track heading and track turn rate are not body yaw or body angular rate.
  - Stage 1 excludes ground contact, takeoff, landing, 600-second scenarios, and smooth-entry/exit mission logic.
