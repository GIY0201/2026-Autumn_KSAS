parameter_provenance:
  motion:
    integration_dt_s: {role: new_simulation_design, basis: Explicit point-mass integration grid dividing the v1 output grid.}
    minimum_horizontal_speed_mps: {role: legacy_simulation_design, basis: scenario.py working-region airspeed lower check.}
    maximum_horizontal_speed_mps: {role: legacy_simulation_design, basis: scenario.py working-region airspeed upper check.}
    maximum_vertical_speed_mps: {role: new_simulation_design, basis: Explicit Stage 1 bounded vertical diagnostic setting.}
    maximum_track_turn_rate_rad_s: {role: derived, basis: g*tan(15 deg)/14 m/s using the legacy command cap and diagnostic minimum speed.}
    horizontal_acceleration_max_mps2: {role: derived, basis: 9.80665*tan(15 deg) using the legacy command cap.}
    tangential_acceleration_max_mps2: {role: new_simulation_design, basis: Explicit shared-budget Stage 1 tangential cap.}
    vertical_acceleration_max_mps2: {role: new_simulation_design, basis: Explicit independent Stage 1 vertical cap.}
    maximum_track_path_angle_deg: {role: new_simulation_design, basis: Explicit track-path check; it is not body pitch.}
  initial_state:
    position_enu_m: {role: legacy_simulation_design, basis: Existing synthetic X8 initialization bounds.}
    horizontal_speed_mps: {role: legacy_simulation_design, basis: Existing X8 nominal target speed.}
    track_heading_deg: {role: legacy_simulation_design, basis: Existing seeded synthetic X8 yaw range reinterpreted only as track heading.}
    vertical_speed_mps: {role: legacy_simulation_design, basis: Existing level initialization.}
    track_turn_rate_rad_s: {role: new_simulation_design, basis: Point-mass initial straight track.}
  commands:
    legacy_straight_distance: {role: derived, basis: 100 m divided by 18 m/s from the legacy first event.}
    legacy_left_turn: {role: derived, basis: Positive ENU track turn for a 30 degree left target at g*tan(10 deg)/18 m/s.}
    legacy_climb: {role: new_simulation_design, basis: Explicit finite hold of the legacy climb target with a positive ENU left track turn and no controller triggers.}
    legacy_recover_and_accelerate: {role: new_simulation_design, basis: Explicit finite hold of legacy recovery targets.}
    legacy_right_turn: {role: derived, basis: Negative ENU track turn for a 30 degree right target at the derived 10 degree-bank track rate.}
    legacy_descent: {role: new_simulation_design, basis: Explicit finite hold of the legacy descent target with a negative ENU right track turn and no controller triggers.}
    legacy_course_hold_to_window_end: {role: legacy_simulation_design, basis: Existing final course-hold target extended to the observation boundary.}
