input_id: doi:10.18710/U4TLYV
evidence_status: SOURCE_AND_DESIGN_CONSTRAINED_KINEMATIC
metadata:
  motion_abstraction: constrained_point_mass_kinematics
  operating_parameter_role: separate_source_reference_legacy_design_and_new_design
  source_model_role: x8_dataset_provenance_and_legacy_diagnostic_not_fitted_dynamics
