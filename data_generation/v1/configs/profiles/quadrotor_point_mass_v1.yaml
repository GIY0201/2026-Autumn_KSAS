limitations:
  - This point-mass runner is separate from the Crazyflie published 6-DOF dynamics and does not call it.
  - The Bitcraze reference envelope is not an aircraft capability, motor, thrust, or attitude claim.
  - The profile does not replay raw commands and does not use mocap02 or mocap03 for tuning.
  - Stage 1 excludes ground contact, 600-second scenarios, and a motion-state inspector.
