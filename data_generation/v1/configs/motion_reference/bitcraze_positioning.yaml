  repository_url: https://github.com/bitcraze/positioning_dataset
  repository_commit: 275865f169ace04221daf7e7630b98d97fde41bd
  timestamp_scale_s: 0.001
  timestamp_unit: ms
  position_unit: m
  supported_column_counts: [4, 16]
  first_four_columns: [timestamp_ms, marker_centroid_x_m, marker_centroid_y_m, marker_centroid_z_m]
  files:
    - id: mocap00
      path: data_sources/bitcraze_positioning/data/lh2_kalman_flight/mocap00.npy
      sha256: 0f37eab8f4d08cfa59790308da726fd3d1881122c2b702baca2584a26a34ad36
