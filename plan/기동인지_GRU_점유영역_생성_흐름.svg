<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px 'Malgun Gothic','Segoe UI',sans-serif; fill:#0f172a; }
      .subtitle { font: 400 18px 'Malgun Gothic','Segoe UI',sans-serif; fill:#475569; }
      .step { font: 700 16px 'Malgun Gothic','Segoe UI',sans-serif; fill:#2563eb; }
      .head { font: 700 22px 'Malgun Gothic','Segoe UI',sans-serif; fill:#0f172a; }
      .body { font: 400 16px 'Malgun Gothic','Segoe UI',sans-serif; fill:#334155; }
      .small { font: 400 14px 'Malgun Gothic','Segoe UI',sans-serif; fill:#475569; }
      .tiny { font: 400 13px 'Malgun Gothic','Segoe UI',sans-serif; fill:#475569; }
      .white-head { font: 700 21px 'Malgun Gothic','Segoe UI',sans-serif; fill:white; }
      .white-body { font: 400 15px 'Malgun Gothic','Segoe UI',sans-serif; fill:white; }
      .arrow { stroke:#475569; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .arrow-blue { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .dash { stroke-dasharray:9 7; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text x="800" y="58" text-anchor="middle" class="title">기동을 이해하는 GRU가 미래 점유 영역을 만드는 과정</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">위치를 바로 외우는 대신, 기동 종류·세기·지속시간을 추정한 뒤 운동방정식으로 미래를 전개한다</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="55" y="150" width="250" height="245" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="78" y="181" class="step">1. 관측</text>
  <text x="78" y="216" class="head">최근 3초</text>
  <text x="78" y="245" class="body">3차원 위치 16개</text>
  <text x="78" y="271" class="body">timestamp · 센서오차</text>
  <polyline points="82,339 104,330 126,334 148,315 170,319 192,293 214,300 236,270 272,254" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="82" cy="339" r="5"/><circle cx="104" cy="330" r="5"/><circle cx="126" cy="334" r="5"/>
    <circle cx="148" cy="315" r="5"/><circle cx="170" cy="319" r="5"/><circle cx="192" cy="293" r="5"/>
    <circle cx="214" cy="300" r="5"/><circle cx="236" cy="270" r="5"/><circle cx="272" cy="254" r="5"/>
  </g>

  <path d="M305 270 L365 270" class="arrow"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="365" y="170" width="250" height="205" rx="22" fill="#2563eb"/>
  </g>
  <text x="390" y="203" class="white-body">2. 학습 모델</text>
  <text x="490" y="247" text-anchor="middle" class="white-head">GRU encoder</text>
  <text x="490" y="279" text-anchor="middle" class="white-body">관측 순서 속에서</text>
  <text x="490" y="305" text-anchor="middle" class="white-body">미세한 기동 징후를 찾음</text>
  <text x="490" y="338" text-anchor="middle" class="white-body">공유된 시간 특징 h</text>

  <path d="M615 270 L675 270" class="arrow-blue"/>

  <!-- Step 3 multi heads -->
  <rect x="675" y="125" width="465" height="300" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="700" y="158" class="step">3. GRU의 네 가지 출력</text>

  <rect x="700" y="180" width="200" height="93" rx="15" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="718" y="207" class="body" font-weight="700">현재 기동 확률</text>
  <text x="718" y="233" class="small">직진 70% · 선회 25%</text>
  <text x="718" y="255" class="small">상승 5%</text>

  <rect x="915" y="180" width="200" height="93" rx="15" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="933" y="207" class="body" font-weight="700">남은 지속시간</text>
  <text x="933" y="233" class="small">1초 내 종료 10%</text>
  <text x="933" y="255" class="small">3초 내 종료 30%</text>

  <rect x="700" y="290" width="200" height="103" rx="15" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="718" y="317" class="body" font-weight="700">기동의 세기</text>
  <text x="718" y="343" class="small">가속 · 감속</text>
  <text x="718" y="365" class="small">회전률 · 상승률의 분포</text>

  <rect x="915" y="290" width="200" height="103" rx="15" fill="#fff7ed" stroke="#fdba74"/>
  <text x="933" y="317" class="body" font-weight="700">Surprise score</text>
  <text x="933" y="343" class="small">새 관측이 예측과 얼마나</text>
  <text x="933" y="365" class="small">다른지 감시</text>

  <path d="M1140 270 L1200 270" class="arrow"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1200" y="145" width="345" height="260" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="1225" y="178" class="step">4. 기동 시나리오 구성</text>
  <text x="1225" y="212" class="head">가능한 미래를 분기</text>
  <rect x="1225" y="235" width="295" height="42" rx="10" fill="#dbeafe"/>
  <text x="1242" y="262" class="body">A · 계속 직진 55%</text>
  <rect x="1225" y="288" width="295" height="42" rx="10" fill="#dcfce7"/>
  <text x="1242" y="315" class="body">B · 2초 뒤 오른쪽 선회 30%</text>
  <rect x="1225" y="341" width="295" height="42" rx="10" fill="#fef3c7"/>
  <text x="1242" y="368" class="body">C · 1초 뒤 상승 15%</text>

  <!-- Step 5 -->
  <path d="M1372 405 L1372 475" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1065" y="475" width="480" height="185" rx="22" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  </g>
  <text x="1090" y="508" class="step" fill="#15803d">5. 수학적 전개</text>
  <text x="1090" y="543" class="head">운동방정식으로 75번 적분</text>
  <text x="1090" y="575" class="body">현재 위치·속도 + 각 시나리오의 기동 입력</text>
  <text x="1090" y="605" class="body">→ 0.2초 간격, 향후 15초의 3차원 위치 분포</text>
  <rect x="1090" y="622" width="425" height="24" rx="8" fill="#bbf7d0"/>
  <text x="1302" y="639" text-anchor="middle" class="tiny">가속이 끝나도 바뀐 속도와 위치는 다음 시점으로 이어짐</text>

  <!-- Step 6 -->
  <path d="M1065 568 L965 568" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="505" y="475" width="460" height="335" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="530" y="508" class="step">6. 점유 영역 생성</text>
  <text x="530" y="543" class="head">경로마다 회랑을 만든 뒤 합침</text>

  <!-- stylized branch corridors -->
  <path d="M555 720 C650 685, 720 650, 900 570" stroke="#60a5fa" stroke-width="34" stroke-linecap="round" opacity="0.22" fill="none"/>
  <path d="M555 720 C650 685, 720 650, 900 570" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M555 720 C665 700, 755 700, 915 745" stroke="#4ade80" stroke-width="34" stroke-linecap="round" opacity="0.22" fill="none"/>
  <path d="M555 720 C665 700, 755 700, 915 745" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M555 720 C655 650, 750 575, 865 535" stroke="#fbbf24" stroke-width="28" stroke-linecap="round" opacity="0.20" fill="none" stroke-dasharray="2 8"/>
  <path d="M555 720 C655 650, 750 575, 865 535" stroke="#d97706" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="8 7"/>
  <circle cx="555" cy="720" r="12" fill="#0f172a"/>
  <text x="555" y="755" text-anchor="middle" class="small">현재 위치</text>
  <text x="842" y="586" class="tiny">직진 회랑</text>
  <text x="830" y="762" class="tiny">선회 회랑</text>
  <text x="742" y="572" class="tiny">상승 회랑</text>
  <text x="530" y="785" class="tiny">각 위치 분포 + 센서오차 + 7 m 객체 크기</text>

  <!-- Output -->
  <path d="M505 642 L405 642" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="55" y="485" width="350" height="320" rx="22" fill="#0f172a"/>
  </g>
  <text x="80" y="520" class="white-body">7. 최종 출력</text>
  <text x="230" y="562" text-anchor="middle" class="white-head">시간별 3차원 점유 분포</text>
  <ellipse cx="145" cy="660" rx="55" ry="34" fill="#3b82f6" opacity="0.48"/>
  <ellipse cx="230" cy="638" rx="72" ry="43" fill="#22c55e" opacity="0.40"/>
  <ellipse cx="315" cy="610" rx="78" ry="52" fill="#f59e0b" opacity="0.35"/>
  <path d="M100 690 C175 650, 250 630, 350 570" stroke="#ffffff" stroke-width="3" opacity="0.8" fill="none" stroke-dasharray="8 7"/>
  <text x="230" y="738" text-anchor="middle" class="white-body">가까운 미래는 좁고</text>
  <text x="230" y="765" text-anchor="middle" class="white-body">멀고 불확실한 미래는 넓어짐</text>

  <!-- Feedback / sudden maneuver handling -->
  <path d="M1015 342 C1005 900, 395 975, 185 835 L185 805" class="arrow-blue dash"/>
  <rect x="545" y="852" width="515" height="116" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="570" y="885" class="step" fill="#c2410c">갑작스러운 기동이 시작되면</text>
  <text x="570" y="917" class="body">새 관측과 예측의 차이 증가 → Surprise score 상승</text>
  <text x="570" y="945" class="body">→ 기동 확률을 다시 계산하고 0.2초마다 전체 회랑 갱신</text>

  <!-- Optional safety layer -->
  <rect x="1100" y="845" width="445" height="145" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1125" y="878" class="step" fill="#c2410c">선택적 안전층</text>
  <text x="1125" y="910" class="body">징후가 전혀 없는 급기동은 미리 맞힐 수 없음</text>
  <text x="1125" y="938" class="body">→ 별도의 물리적 최대 기동 영역으로 대비</text>
  <text x="1125" y="968" class="small">이 층이 없다면 미관측 급기동 포함을 보장할 수 없음</text>

  <!-- Legend -->
  <rect x="55" y="1025" width="1490" height="50" rx="14" fill="#e2e8f0"/>
  <circle cx="90" cy="1050" r="8" fill="#2563eb"/><text x="108" y="1056" class="small">GRU가 데이터에서 학습</text>
  <circle cx="355" cy="1050" r="8" fill="#16a34a"/><text x="373" y="1056" class="small">운동방정식이 계산</text>
  <circle cx="625" cy="1050" r="8" fill="#f97316"/><text x="643" y="1056" class="small">급기동 감지·대비</text>
  <text x="1515" y="1056" text-anchor="end" class="small">이 그림은 검토 중인 후보 구조이며 현재 설계의 확정 변경이 아님</text>
</svg>
